<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>G1 Ultra $0 · PK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 286px;
      color: #1c2a3a;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 12px;
      padding: 12px;
      background: linear-gradient(180deg, #f7fbff 0%, #eef5fb 100%);
    }
    .head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .logo { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; display: block; box-shadow: 0 2px 8px rgba(42,171,238,.22); }
    .titles b { display: block; font-size: 14px; color: #102033; }
    .titles span { display: block; font-size: 10px; color: #5f7388; margin-top: 2px; }
    .status {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #c7e7f7;
      background: #eef8ff;
      color: #176a8f;
      font-size: 11px;
      margin-bottom: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sku, .period { display: grid; gap: 6px; margin-bottom: 8px; }
    .sku { grid-template-columns: 1fr 1fr; }
    .period { grid-template-columns: repeat(4, 1fr); }
    .chip {
      appearance: none;
      border: 1px solid #d5e3ef;
      background: #fff;
      color: #1c2a3a;
      border-radius: 10px;
      padding: 8px 0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .chip:hover { border-color: #2AABEE; background: #f3faff; }
    .chip.is-on {
      border-color: #2AABEE;
      background: #e7f6ff;
      color: #0b6fa0;
      box-shadow: 0 0 0 1px rgba(42,171,238,.18) inset;
    }
    .foot { display: flex; gap: 6px; }
    .foot button, .foot a {
      flex: 1;
      height: 28px;
      border-radius: 8px;
      border: 1px solid #d5e3ef;
      background: #fff;
      color: #33485c;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }
    #popup-pk { border-color: #b7e4f8; color: #1480b0; background: #f3fbff; }
  </style>
</head>
<body>
  <div class="head">
    <img class="logo" src="icons/icon48.png" alt="PK" />
    <div class="titles">
      <b>G1 Ultra $0</b>
      <span>PK频道 · t.me/pk_oa</span>
    </div>
  </div>

  <div id="popup-status" class="status">选档位后自己打开付款</div>

  <div id="sku-row" class="sku">
    <button type="button" class="chip" data-sku="20tb">Ultra 20TB</button>
    <button type="button" class="chip" data-sku="30tb">Ultra 30TB</button>
  </div>
  <div id="period-row" class="period">
    <button type="button" class="chip" data-months="12">12月</button>
    <button type="button" class="chip" data-months="6">6月</button>
    <button type="button" class="chip" data-months="3">3月</button>
    <button type="button" class="chip" data-months="1">1月</button>
  </div>

  <div class="foot">
    <button id="popup-us-btn" type="button">🇺🇸 OR 97201</button>
    <a id="popup-pk" href="https://t.me/pk_oa" target="_blank" rel="noopener noreferrer">PK频道</a>
  </div>

  <script src="presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
