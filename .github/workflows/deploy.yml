name: Deploy to VPS

on:
  push:
    branches:
      - main  # Sesuaikan jika branch utama Anda bernama 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Eksekusi Script Deployment via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            /var/www/djpbmedan/deploy.sh
